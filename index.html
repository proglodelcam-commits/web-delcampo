<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG del Campo | Inicio</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Barra de Navegación -->
    <header>
        <div class="nav-container">
            <h1 id="site-title">PG del Campo</h1>
            <nav>
                <ul>
                    <li><a href="#" class="active">Inicio</a></li>
                    <li><a href="#productos">Productos</a></li>
                    <li><a href="#empresa">Nuestra Empresa</a></li>
                    <li><a href="#fidelidad">Club de Fidelidad</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Héroe / Banner Principal -->
    <section class="hero">
        <div class="hero-content">
            <p class="faith-phrase" id="faith-phrase">...</p>
            <h2 id="hero-slogan">...</h2>
            <p class="sub-tag">Productos frescos y de calidad directamente para ti.</p>
        </div>
    </section>

    <!-- Botones de Acción Principal (Enlaces Editables) -->
    <section class="action-grid">
        <a href="#empresa" class="card-btn"><i class="fas fa-building"></i> Nuestra Empresa</a>
        <a href="" id="link-kyte" target="_blank" class="card-btn highlight"><i class="fas fa-shopping-basket"></i> Nuestros Productos (Kyte)</a>
        <a href="#nutricion" class="card-btn"><i class="fas fa-apple-alt"></i> Tabla Nutricional</a>
        <a href="" id="link-qr" target="_blank" class="card-btn"><i class="fas fa-qrcode"></i> Realiza tus Pagos</a>
        <a href="" id="link-app" target="_blank" class="card-btn"><i class="fas fa-mobile-alt"></i> Convertir a APP</a>
        <a href="" id="link-agent" target="_blank" class="card-btn"><i class="fas fa-comments"></i> Contacta un Agente</a>
    </section>

    <!-- Pie de Página -->
    <footer>
        <div class="footer-info">
            <p id="footer-location"></p>
            <p id="footer-contact"></p>
            <p id="footer-copy"></p>
        </div>
    </footer>

    <!-- Carga de Scripts Dinámicos -->
    <script href="js/config.js"></script>
    <script href="js/main.js"></script>
</body>
</html>
